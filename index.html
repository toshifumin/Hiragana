<!DOCTYPE html><html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ひらがな音読ゲーム</title>
<style>
body{font-family:sans-serif;text-align:center;background:#EAF6FF;color:#123;margin:0}
h1{font-size:56px}
#score{font-weight:bold}
#debug{height:40px}
#game{position:relative;height:65vh;background:#fff;border:2px solid #bcd;overflow:hidden}
#char{position:absolute;left:50%;transform:translateX(-50%);font-size:96px;font-weight:bold;top:0}
button{font-size:32px;padding:12px 24px;margin:8px}
</style></head><body>
<h1>ひらがな音読ゲーム</h1>
<p style="font-size:36px">得点:<span id="score">0</span></p>
<p id="debug"></p>
<button onclick="startGame()">開始</button>
<button onclick="stopGame()">終了</button>
<div id="game"><div id="char"></div></div>
<script>
const words=['いぬ', 'ねこ', 'くま', 'さる', 'うま', 'とり', 'うみ', 'やま', 'かわ', 'そら', 'はな', 'ふね', 'えき', 'みず', 'りす', 'きつね', 'たぬき', 'ぱん', 'りんご', 'すいか'];
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
const recog=SpeechRecognition?new SpeechRecognition():null;
let current='',score=0,y=0,timer=null,gameRunning=false;

function sound(ok){
 const ctx=new (window.AudioContext||window.webkitAudioContext)();
 const o=ctx.createOscillator();
 const g=ctx.createGain();
 o.connect(g); g.connect(ctx.destination);
 o.frequency.value=ok?880:220;
 g.gain.value=0.08;
 o.start();
 o.stop(ctx.currentTime+0.15);
}

function spawn(){
 current=words[Math.floor(Math.random()*words.length)];
 const c=document.getElementById('char');
 c.textContent=current;
 y=0;
 c.style.top='0px';
}

function startListening(){
 if(!recog||!gameRunning) return;
 try{recog.start();}catch(e){}
}

function startGame(){
 if(gameRunning) return;
 gameRunning=true;
 spawn();

 recog.lang='ja-JP';
 recog.continuous=false;
 recog.interimResults=false;

 recog.onresult=(e)=>{
   const raw=e.results[e.results.length-1][0].transcript.trim();
   const norm=raw.replace(/[。、！!？?\s]+$/,'');
   document.getElementById('debug').textContent='認識: '+raw+' / 正解: '+current;

   if(norm===current || norm.includes(current)){
      score+=100;
      document.getElementById('score').textContent=score;
      sound(true);
      try{recog.abort();}catch(e){}
      spawn();
   } else {
      sound(false);
   }
 };

 recog.onend=()=>{
   if(gameRunning){
      setTimeout(startListening,300);
   }
 };

 startListening();

 timer=setInterval(()=>{
   y+=2;
   document.getElementById('char').style.top=y+'px';
   if(y>window.innerHeight*0.55) spawn();
 },30);
}

function stopGame(){
 gameRunning=false;
 clearInterval(timer);
 if(recog) try{recog.stop();}catch(e){}
}
</script></body></html>
