<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ひらがな音読ゲーム Ver.2</title>
<style>
body{font-family:sans-serif;text-align:center;background:#EAF6FF;color:#123;margin:0}
#game{position:relative;height:70vh;border:1px solid #9cc;overflow:hidden;background:white}
#char{position:absolute;font-size:56px;left:40%;top:0;font-weight:bold}
button{font-size:20px;padding:10px;margin:4px}
</style></head><body>
<h1>ひらがな音読ゲーム</h1>
<p>得点:<span id="score">0</span></p>
<p id="debug">(認識結果)</p>
<button onclick="startGame()">開始</button>
<button onclick="stopGame()">終了</button>
<div id="game"><div id="char"></div></div>
<script>
const words=['いぬ', 'ねこ', 'くま', 'さる', 'ふね', 'えき', 'そら', 'やま', 'かわ', 'はな', 'りんご', 'ばなな', 'すいか', 'めろん', 'でんしゃ', 'じてんしゃ', 'うみ', 'もり', 'とり', 'うさぎ', 'きつね', 'たぬき', 'こあら', 'ぱん', 'おにぎり', 'みず'];
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
const recog=SpeechRecognition?new SpeechRecognition():null;
let current='',score=0,y=0,timer,gameRunning=false;

function beep(freq,dur){
 const ctx=new (window.AudioContext||window.webkitAudioContext)();
 const o=ctx.createOscillator(); const g=ctx.createGain();
 o.frequency.value=freq; o.connect(g); g.connect(ctx.destination);
 o.start(); g.gain.setValueAtTime(0.1,ctx.currentTime);
 o.stop(ctx.currentTime+dur);
}

function spawn(){
 current=words[Math.floor(Math.random()*words.length)];
 let c=document.getElementById('char');
 c.textContent=current;
 y=0;
 c.style.top='0px';
}

function startListening(){
 if(!recog) return;
 try{recog.start();}catch(e){}
}

function startGame(){
 spawn();
 gameRunning=true;
 if(recog){
  recog.lang='ja-JP';
  recog.continuous=false;
  recog.interimResults=false;

  recog.onresult=e=>{
    const res=e.results[e.results.length-1];
    const t=res[0].transcript.trim().replace(/[。、\s]+$/,'');
    document.getElementById('debug').textContent=`[確定] "${t}" (正解:${current})`;

    if(t===current){
      score+=100;
      document.getElementById('score').textContent=score;
      beep(880,0.15);
      try{recog.abort();}catch(e){}
      spawn();
      setTimeout(startListening,400);
    }
  };

  recog.onend=()=>{};
  startListening();
 }

 timer=setInterval(()=>{
   y+=2;
   document.getElementById('char').style.top=y+'px';
   if(y>window.innerHeight*0.6) spawn();
 },30);
}

function stopGame(){
 gameRunning=false;
 clearInterval(timer);
 if(recog) try{recog.stop();}catch(e){}
}
</script></body></html>
