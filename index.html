<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<title>ひらがな音読ゲーム</title>
<style>
body{font-family:sans-serif;text-align:center;background:#111;color:#fff}
#game{position:relative;height:70vh;border:1px solid #444;overflow:hidden}
#char{position:absolute;font-size:72px;left:45%;top:0}
button{font-size:20px;padding:10px}
</style></head>
<body>
<h1>ひらがな音読ゲーム</h1>
<p>得点:<span id="score">0</span></p>
<p style="font-size:14px;color:#0f0" id="debug">(認識結果がここに表示されます)</p>
<button onclick="startGame()">開始</button>
<button onclick="stopGame()">終了</button>
<div id="game"><div id="char"></div></div>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
const chars="あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん".split("");
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const recog = SpeechRecognition ? new SpeechRecognition() : null;
let current='',y=0,score=0,timer,gameRunning=false;
function spawn(){current=chars[Math.floor(Math.random()*chars.length)];
let c=document.getElementById('char');c.textContent=current;y=0;c.style.top='0px';}
function startGame(){
spawn();
gameRunning=true;
if(recog){
recog.lang='ja-JP';
recog.continuous=false;
recog.interimResults=false;
const dbg=document.getElementById('debug');
recog.onresult=e=>{
let res=e.results[e.results.length-1];
let raw=res[0].transcript;
// Strip trailing punctuation/spaces Safari sometimes appends (。、 space)
// so a spoken "あ" that comes back as "あ。" still counts as a match.
let t=raw.trim().replace(/[。、\s]+$/,'');
dbg.textContent=(res.isFinal?'[確定] ':'[認識中] ')+'"'+raw+'" (正解:'+current+')';
if(res.isFinal && t===current){
score+=100;document.getElementById('score').textContent=score;spawn();
}
};
// Safari (particularly iOS) ends the recognition session after a short
// pause even with continuous=true, unlike Chrome which keeps listening.
// Without restarting here, Safari users get exactly one recognized
// utterance and then silence.
recog.onend=()=>{
if(gameRunning){
try{recog.start();}catch(err){/* already starting/started */}
}
};
recog.onerror=e=>{
// Show every error on screen (including routine 'no-speech'/'aborted',
// which onend will recover from) so a silent failure is never invisible
// on a phone where the console isn't easily reachable.
dbg.textContent='[エラー] '+e.error;
console.warn('SpeechRecognition error:',e.error);
if(e.error==='not-allowed'||e.error==='service-not-allowed'){
alert('マイクの使用が許可されていません。Safariの設定でマイクへのアクセスを許可してください。');
gameRunning=false;
}
};
recog.onstart=()=>{dbg.textContent='[待機中] マイク起動';};
try{recog.start();}catch(err){dbg.textContent='[開始失敗] '+err.message;console.warn('recog.start failed:',err);}
}else{
alert('お使いのブラウザは音声認識に対応していません。');
}
timer=setInterval(()=>{
y+=3; document.getElementById('char').style.top=y+'px';
if(y>window.innerHeight*0.6) spawn();
},30);
}
function stopGame(){
gameRunning=false;
clearInterval(timer);
if(recog){try{recog.stop();}catch(err){}}
}
</script></body></html>
